[project]
name = "production-env"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "argparse>=1.4.0",
    "arrow>=1.3.0",
    "credit>=0.0.1",
    "dask>=2025.9.0",
    "datetime>=5.5",
    "ipykernel>=6.30.1",
    "mlflow>=3.3.2",
    "numpy>=2.3.3",
    "optuna>=4.8.0",
    "shap>=0.48.0",
    "numba>=0.57.0",
    "pandas>=2.3.2",
    "pyarrow>=21.0.0",
    "python-dotenv>=1.1.1",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "ucimlrepo>=0.0.7",
    "utils>=1.0.2",
    "venn-abers>=1.5.3",
    "yfinance>=0.2.65",
]

[dependency-groups]
dev = [
    "pyrefly>=1.0.0",
    "pytest>=9.1.1",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
testpaths = ["05_src/tests"]
pythonpath = ["05_src"]
addopts = ["--import-mode=importlib", "--strict-markers", "-p", "pytester", "-ra"]
markers = [
    "unit: fast, exact-value checks of a single function or class",
    "pipeline: end-to-end data pipeline runs into temporary directories",
    "experiment: MLflow-logging runs against the temporary tracking store",
]

[tool.pyrefly]
search-path = ["05_src"]
