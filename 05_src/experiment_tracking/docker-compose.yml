services:  
  # PostgreSQL database
  postgres:
    container_name: postgres
    image: postgres:18
    restart: always
    ports:
      - "5432:5432"
    env_file: ./.env
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - ./postgres_data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
  # pgAdmin4
  # A web-based database management tool for PostgreSQL
  pgadmin:
    container_name: pgadmin4_dsi_container
    image: dpage/pgadmin4:9.18
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: '${PGADMIN_DEFAULT_EMAIL}'
      PGADMIN_DEFAULT_PASSWORD: '${PGADMIN_DEFAULT_PASSWORD}'
    ports:
      - "5051:80"
  # MLflow
  # An open-source platform for managing the ML lifecycle
  # It includes experimentation, reproducibility, and deployment
  # Artifacts are stored on the host in ./mlflow_artifacts and proxied
  # through the tracking server, so clients only need HTTP access to it.
  mlflow:
    restart: always
    build: ./mlflow
    container_name: mlflow_server
    ports:
      - "5001:5000"
    env_file: ./.env
    volumes:
      - ./mlflow_artifacts:/mlflow/artifacts
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/mlflow
      --host 0.0.0.0
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
  